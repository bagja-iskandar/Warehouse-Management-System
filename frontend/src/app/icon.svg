<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="layerGradTop" x1="16" y1="18" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="dropShadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Logistics & Warehouse Multi-Tier Layers -->
  <g filter="url(#dropShadow)">
    <!-- Top Layer (Warehouse Diamond Cap) -->
    <path d="M32 14L49 22.5L32 31L15 22.5L32 14Z" fill="url(#layerGradTop)" />

    <!-- Middle Layer (Cold Storage Deck) -->
    <path d="M15 29L32 37.5L49 29" stroke="#EEF2FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Layer (Heavy Duty / Logistics Floor) -->
    <path d="M15 37.5L32 46L49 37.5" stroke="#C7D2FE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
